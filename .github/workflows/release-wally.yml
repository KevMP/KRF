name: Release (Wally)

# Releases the KRF runtime version that main declares. When CI passes on a main commit whose
# wally.toml version has no tag yet, this workflow validates the commit, tags it vMAJOR.MINOR.PATCH,
# publishes it, then proves the registry serves the tagged source and that a fresh consumer can
# install and start it. Release PRs (release-pr.yml) change that version.
# A manual run resumes or re-verifies an existing tag; it never republishes a version the
# registry has.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to verify or resume
        required: true

permissions:
  contents: read

# One release at a time, never cancelled midway.
concurrency:
  group: release-wally
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Choose the release
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$TAG" ]; then
            node scripts/release-wally.cjs resolve --tag "$TAG"
          else
            node scripts/release-wally.cjs resolve --commit "$COMMIT"
          fi

  preflight:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      package: ${{ steps.preflight.outputs.package }}
      version: ${{ steps.preflight.outputs.version }}
      commit: ${{ steps.preflight.outputs.commit }}
      already_published: ${{ steps.preflight.outputs.already_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Cache Rokit
        uses: actions/cache@v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install tools (Rokit)
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: |
          wally install
          npm ci

      - name: Require a successful CI run for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          passed="$(gh run list --workflow ci.yml --commit "$commit" --status success --json databaseId --jq 'length')"
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed for $commit. Wait for it, then rerun this workflow."
            exit 1
          fi

      - name: Validate tagged source
        run: |
          npm run test:release-tools
          npm run typecheck
          npm run test:lint

      - name: Check tag, manifest, archive and registry
        id: preflight
        run: node scripts/release-wally.cjs preflight --tag "$RELEASE_TAG"

  tag:
    needs: [resolve, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the release commit
        if: needs.resolve.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" > /dev/null; then
            echo "::error::Could not create $TAG. The v* tag ruleset must let GitHub Actions bypass tag creation."
            exit 1
          fi
          echo "- Tagged \`$COMMIT\` as $TAG" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [resolve, preflight, tag]
    if: needs.preflight.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment: wally-release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Cache Rokit
        uses: actions/cache@v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install tools (Rokit)
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Confirm the tag still names the preflighted commit
        run: test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"

      - name: Publish
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_PUBLISH_TOKEN }}
        run: |
          if [ -z "$WALLY_TOKEN" ]; then
            echo "::error::WALLY_PUBLISH_TOKEN is not configured."
            exit 1
          fi
          wally login --token "$WALLY_TOKEN" > /dev/null
          node scripts/release-wally.cjs publish

      - name: Remove registry credentials
        if: always()
        run: rm -f ~/.wally/auth.toml

  verify:
    needs: [resolve, preflight, tag, publish]
    if: >-
      always() && needs.preflight.result == 'success' && needs.tag.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: oc-tests-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_TEST_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_TEST_PLACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Cache Rokit
        uses: actions/cache@v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install tools (Rokit)
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Read back the registry archive
        run: node scripts/release-wally.cjs verify-registry --version "${{ needs.preflight.outputs.version }}"

      - name: Install the published version in a fresh consumer
        id: consumer
        run: node scripts/release-wally.cjs consumer --source registry --version "${{ needs.preflight.outputs.version }}" --out build/consumer/registry

      - name: Start KRF from the installed package
        run: python3 -u scripts/upload_and_run_task.py "${{ steps.consumer.outputs.place }}" tests/consumer/Smoke.luau --no-coverage

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "KRF $RELEASE_TAG" --generate-notes \
              --notes "Wally: \`${{ needs.preflight.outputs.package }}@${{ needs.preflight.outputs.version }}\`. Registry contents match the tagged source; a clean consumer installed and started it."
          fi
          echo "- Release $RELEASE_TAG verified and finalized" >> "$GITHUB_STEP_SUMMARY"
