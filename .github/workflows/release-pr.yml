name: Release PR

# Opens a pull request that bumps the KRF runtime version. Merging it releases that version:
# once CI passes on main, release-wally.yml tags the merge commit and publishes it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact MAJOR.MINOR.PATCH version instead of the bump (optional)
        required: false

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump the version
        id: bump
        env:
          TARGET: ${{ inputs.version || inputs.bump }}
        run: node scripts/release-wally.cjs bump --to "$TARGET"

      - name: Push the release branch
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$TAG"
          git commit -am "chore(release): $TAG"
          git push --force origin "release/$TAG"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREVIOUS: ${{ steps.bump.outputs.previous }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ -n "$(gh pr list --head "release/$TAG" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for release/$TAG is already open; its branch was updated."
          else
            gh pr create --base main --head "release/$TAG" --title "chore(release): $TAG" --body \
              "Bumps \`kevmp/krf\` from $PREVIOUS to $VERSION in \`wally.toml\`, \`wally.lock\` and the install snippets. Merging publishes $TAG to Wally after CI passes on \`main\`. The GitHub Release notes list the pull requests merged since the previous release."
          fi

      # Events from the workflow token do not start other workflows, so request CI for the branch
      # explicitly; its checks attach to the release commit and satisfy branch protection.
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: gh workflow run ci.yml --ref "release/$TAG"
