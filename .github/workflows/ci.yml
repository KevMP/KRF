name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Avoid overlapping tasks against the same test place
    concurrency:
      group: oc-tests-${{ github.ref }}
      cancel-in-progress: false

    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_TEST_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_TEST_PLACE_ID }}
      TEST_TASK_FILE: tests/run-tests.luau

    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Cache Rokit
        uses: actions/cache@v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install tools (Rokit)
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install packages (Wally)
        run: wally install

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node deps
        run: npm ci

      - name: Test CI tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test benchmark comparison tooling
        run: npm run test:bench-tools

      - name: Test release tooling
        run: npm run test:release-tools

      - name: Test create-krf and krf-tools
        run: npm run test:packages

      - name: Create a project from packed npm tarballs
        run: npm run test:packages:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Lint checks
        run: npm run test:lint

      - name: Build test place (Rojo)
        run: rojo build test.project.json -o dist.rbxl

      - name: Upload place and run tests
        id: tests
        run: python3 -u scripts/upload_and_run_task.py dist.rbxl "$TEST_TASK_FILE"

      - name: Generate and check coverage
        if: always() && steps.tests.outcome == 'success'
        run: npm run coverage

      # Preflight for releases: install the packaged archive the way Wally does and start KRF from it.
      - name: Build package consumer (Wally archive)
        id: consumer
        run: node scripts/release-wally.cjs consumer --source archive --out build/consumer/archive

      - name: Start KRF from the packaged archive
        run: python3 -u scripts/upload_and_run_task.py "${{ steps.consumer.outputs.place }}" tests/consumer/Smoke.luau --no-coverage

  configurations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: Cache Rokit
        uses: actions/cache@v4
        with:
          path: ~/.rokit
          key: rokit-configurations-${{ runner.os }}-${{ hashFiles('rokit.toml', 'packages/create-krf/src/compatibility.js', 'packages/create-krf/src/manifests.js') }}

      - name: Install tools (Rokit)
        run: |
          rokit install --no-trust-check
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node deps
        run: npm ci

      - name: Create every configuration from packed npm tarballs
        run: npm run test:packages:configurations
