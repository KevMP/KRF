name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project tooling
        run: npm ci

      - name: Validate project configuration
        run: npm run project:info
